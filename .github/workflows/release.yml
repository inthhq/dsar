# .github/workflows/release.yml
name: Release

on:
  push:
    branches:
      - main
      - canary # Canary snapshots

permissions: {}

# Keep checks and publishing in the same branch-level concurrency group.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # npm trusted publishing binds the OIDC identity to the *top-level* workflow
  # file. Publishing must therefore start here and pull the checks in, rather
  # than `ci.yml` calling this file.
  checks:
    name: Checks
    if: github.repository == 'inthhq/dsar'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Release ${{ github.ref == 'refs/heads/canary' && 'Canary' || '' }}
    needs: checks
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    if: github.repository == 'inthhq/dsar'
    permissions:
      contents: write # Tegami creates releases, tags, and version commits
      pull-requests: write # Tegami opens the version pull request
      id-token: write # OIDC trusted publishing with npm
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tegami uses release tags and changelog history.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"

      # npm 11.5.1+ is required for trusted publishing (OIDC). The runner's
      # preinstalled npm can have broken internal deps, so corepack installs a
      # clean one.
      - name: Update npm for trusted publishing
        run: |
          corepack enable npm
          corepack install -g npm@12.0.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version or publish packages
        if: github.ref != 'refs/heads/canary'
        run: bun run tegami ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm prefers OIDC trusted publishing; the token covers the package
          # until a trusted publisher is configured for release.yml.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Each canary commit gets its own snapshot; never reuse a lock from main.
      - name: Version and publish canary snapshot
        if: github.ref == 'refs/heads/canary'
        run: |
          bun run tegami version --no-checks
          bun run tegami publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm prefers OIDC trusted publishing; the token covers the package
          # until a trusted publisher is configured for release.yml.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
